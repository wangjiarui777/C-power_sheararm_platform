global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: phm-java
    metrics_path: /internal/actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8081"]
  - job_name: phm-inference
    metrics_path: /internal/metrics
    http_headers:
      X-Internal-Token:
        values: ["REPLACE_WITH_INTERNAL_TOKEN"]
    static_configs:
      - targets: ["127.0.0.1:5000"]
  - job_name: windows
    static_configs:
      - targets: ["127.0.0.1:9182"]
