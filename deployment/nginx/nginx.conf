worker_processes auto;
events { worker_connections 4096; }
http {
  include mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 34m;
  log_format json escape=json '{"time":"$time_iso8601","requestId":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"elapsed":$request_time}';
  access_log logs/access.json json;
  error_log logs/error.log warn;

  upstream phm_java { server 127.0.0.1:8080; keepalive 64; }
  server {
    listen 443 ssl;
    server_name phm.factory.internal;
    ssl_certificate conf/certs/phm.crt;
    ssl_certificate_key conf/certs/phm.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss:; upgrade-insecure-requests" always;

    root ../../current/frontend;
    location / { try_files $uri $uri/ /index.html; }
    location /prod-api/ {
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://phm_java/;
    }
    location /ws/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Request-Id $request_id;
      proxy_pass http://phm_java;
    }
  }
}
