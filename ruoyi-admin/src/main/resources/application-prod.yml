ruoyi:
  profile: ${RUOYI_PROFILE}

sensor:
  attachment:
    root: ${SENSOR_ATTACHMENT_ROOT}
    scan-required: true
    virus-scan-command: ${SENSOR_ATTACHMENT_SCAN_COMMAND}
    virus-scan-arguments: ${SENSOR_ATTACHMENT_SCAN_ARGUMENTS}
  default-device-code: ""
  websocket:
    allowed-origins: ${SENSOR_WS_ALLOWED_ORIGINS}
  inference:
    gear-url: ${SENSOR_GEAR_INFER_URL:http://127.0.0.1:5001/internal/infer}
    bearing-url: ${SENSOR_BEARING_INFER_URL:http://127.0.0.1:5002/internal/infer}
    preview-url: ${SENSOR_INFERENCE_PREVIEW_URL:}
    gear-model-version: ${GEAR_MODEL_VERSION:gear-unregistered}
    bearing-model-version: ${BEARING_MODEL_VERSION:bearing-unregistered}
    internal-token: ${SENSOR_INFERENCE_INTERNAL_TOKEN}
    default-device-code: ""
    default-model-type: gear
  health:
    # 推理进程故障时 Java 仍保持 MAT 接收/存储可用，任务记录报告失败。
    inference-required: ${SENSOR_INFERENCE_REQUIRED:false}
  mat-receiver:
    enabled: ${SENSOR_MAT_RECEIVER_ENABLED:true}
    bind-address: ${SENSOR_MAT_RECEIVER_BIND_ADDRESS:0.0.0.0}
    port: ${SENSOR_MAT_RECEIVER_PORT:8888}
  startup:
    inference:
      enabled: false
  iotdb:
    enabled: true
    node-urls: ${IOTDB_NODE_URLS}
    username: ${IOTDB_USERNAME}
    password: ${IOTDB_PASSWORD}
    use-ssl: ${IOTDB_USE_SSL:false}
    trust-store: ${IOTDB_TRUST_STORE:}
    trust-store-password: ${IOTDB_TRUST_STORE_PASSWORD:}

lowcode:
  connector:
    proxy-host: ${LOWCODE_OUTBOUND_PROXY_HOST}
    proxy-port: ${LOWCODE_OUTBOUND_PROXY_PORT}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LOWCODE_DB_URL}
    username: ${LOWCODE_DB_USERNAME}
    password: ${LOWCODE_DB_PASSWORD}
    hikari:
      minimum-idle: ${LOWCODE_DB_MIN_IDLE:1}
      maximum-pool-size: ${LOWCODE_DB_MAX_ACTIVE:10}
      connection-timeout: ${LOWCODE_DB_CONNECTION_TIMEOUT_MS:30000}

spring:
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:32MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:34MB}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2026041700
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:5}
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:20}
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${MYSQL_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${MYSQL_POOL_IDLE_TIMEOUT_MS:600000}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
      timeout: 10s
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD}
    timeout: 10s

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    enabled-by-default: false
    web:
      base-path: /internal/actuator
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: phm-platform

xss:
  enabled: true

referer:
  enabled: true
  allowed-domains: ${REFERER_ALLOWED_DOMAINS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  file:
    path: ${LOG_PATH}
