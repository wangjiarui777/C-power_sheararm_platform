ruoyi:
  profile: ${RUOYI_PROFILE}

sensor:
  attachment:
    root: ${SENSOR_ATTACHMENT_ROOT}
    scan-required: true
    virus-scan-command: ${SENSOR_ATTACHMENT_SCAN_COMMAND}
    virus-scan-arguments: ${SENSOR_ATTACHMENT_SCAN_ARGUMENTS}
  default-device-code: ""
  collector:
    master-key: ${SENSOR_COLLECTOR_MASTER_KEY}
  websocket:
    allowed-origins: ${SENSOR_WS_ALLOWED_ORIGINS}
  inference:
    gear-url: ${SENSOR_GEAR_INFER_URL:http://127.0.0.1:5001/internal/infer}
    bearing-url: ${SENSOR_BEARING_INFER_URL:http://127.0.0.1:5002/internal/infer}
    gear-model-version: ${GEAR_MODEL_VERSION:gear-unregistered}
    bearing-model-version: ${BEARING_MODEL_VERSION:bearing-unregistered}
    internal-token: ${SENSOR_INFERENCE_INTERNAL_TOKEN}
    default-device-code: ""
    default-model-type: gear
  health:
    # 推理进程故障时 Java 仍保持采集/存储可用，由实时诊断状态接口报告降级。
    inference-required: ${SENSOR_INFERENCE_REQUIRED:false}
  startup:
    inference:
      enabled: false
    receiver:
      enabled: false
  tcp:
    enabled: false
  channel-tcp:
    enabled: ${SENSOR_TCP_ENABLED:false}
    bind-address: ${SENSOR_TCP_BIND_ADDRESS:127.0.0.1}
    port: ${SENSOR_TCP_PORT:8891}
    socket-timeout-ms: ${SENSOR_TCP_SOCKET_TIMEOUT_MS:30000}
    max-frame-bytes: ${SENSOR_TCP_MAX_FRAME_BYTES:8388608}
    worker-threads: ${SENSOR_TCP_WORKER_THREADS:8}
  iotdb:
    enabled: true
    node-urls: ${IOTDB_NODE_URLS}
    username: ${IOTDB_USERNAME}
    password: ${IOTDB_PASSWORD}
    use-ssl: ${IOTDB_USE_SSL:false}
    trust-store: ${IOTDB_TRUST_STORE:}
    trust-store-password: ${IOTDB_TRUST_STORE_PASSWORD:}

lowcode:
  connector:
    proxy-host: ${LOWCODE_OUTBOUND_PROXY_HOST}
    proxy-port: ${LOWCODE_OUTBOUND_PROXY_PORT}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LOWCODE_DB_URL}
    username: ${LOWCODE_DB_USERNAME}
    password: ${LOWCODE_DB_PASSWORD}
    initial-size: 1
    min-idle: 1
    max-active: ${LOWCODE_DB_MAX_ACTIVE:10}

spring:
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:32MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:34MB}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2026041700
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  datasource:
    druid:
      master:
        url: ${MYSQL_URL}
        username: ${MYSQL_USERNAME}
        password: ${MYSQL_PASSWORD}
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
      timeout: 10s
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD}
    timeout: 10s

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    enabled-by-default: false
    web:
      base-path: /internal/actuator
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: phm-platform

xss:
  enabled: true

referer:
  enabled: true
  allowed-domains: ${REFERER_ALLOWED_DOMAINS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  file:
    path: ${LOG_PATH}
