ruoyi:
  profile: ${RUOYI_PROFILE}

sensor:
  attachment:
    root: ${SENSOR_ATTACHMENT_ROOT}
    scan-required: true
    virus-scan-command: ${SENSOR_ATTACHMENT_SCAN_COMMAND}
    virus-scan-arguments: ${SENSOR_ATTACHMENT_SCAN_ARGUMENTS}
  default-device-code: ""
  collector:
    master-key: ${SENSOR_COLLECTOR_MASTER_KEY}
  websocket:
    allowed-origins: ${SENSOR_WS_ALLOWED_ORIGINS}
  inference:
    gear-url: ${SENSOR_INFER_URL}
    bearing-url: ${SENSOR_INFER_URL}
    internal-token: ${SENSOR_INFERENCE_INTERNAL_TOKEN}
    default-device-code: ""
    default-model-type: gear
  health:
    inference-required: true
  startup:
    inference:
      enabled: false
    receiver:
      enabled: false
  tcp:
    enabled: false
  channel-tcp:
    enabled: ${SENSOR_TCP_ENABLED:false}
    bind-address: ${SENSOR_TCP_BIND_ADDRESS:127.0.0.1}
    port: ${SENSOR_TCP_PORT:8891}
    socket-timeout-ms: ${SENSOR_TCP_SOCKET_TIMEOUT_MS:30000}
    max-frame-bytes: ${SENSOR_TCP_MAX_FRAME_BYTES:8388608}
    worker-threads: ${SENSOR_TCP_WORKER_THREADS:8}
  iotdb:
    enabled: true
    node-urls: ${IOTDB_NODE_URLS}
    username: ${IOTDB_USERNAME}
    password: ${IOTDB_PASSWORD}
    use-ssl: ${IOTDB_USE_SSL:false}
    trust-store: ${IOTDB_TRUST_STORE:}
    trust-store-password: ${IOTDB_TRUST_STORE_PASSWORD:}

spring:
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 130MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2026041700
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  datasource:
    druid:
      master:
        url: ${MYSQL_URL}
        username: ${MYSQL_USERNAME}
        password: ${MYSQL_PASSWORD}
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
      timeout: 10s
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD}
    timeout: 10s

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    enabled-by-default: true
    web:
      base-path: /internal/actuator
      exposure:
        include: health,info,prometheus,metrics,loggers
  metrics:
    tags:
      application: phm-platform

xss:
  enabled: true

referer:
  enabled: true
  allowed-domains: ${REFERER_ALLOWED_DOMAINS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  file:
    path: ${LOG_PATH}

token:
  secret: ${JWT_SECRET}
  previous-secrets: ${JWT_PREVIOUS_SECRETS:}
