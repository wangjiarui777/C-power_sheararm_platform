# 项目相关配置
ruoyi:
  # 名称
  name: 振动温度监测平台
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${RUOYI_PROFILE:./.local-data/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 低代码动态运行时：生产默认只读，开发环境可通过环境变量显式开启。
lowcode:
  runtime:
    write-enabled: ${LOWCODE_RUNTIME_WRITE_ENABLED:false}
  connector:
    proxy-host: ${LOWCODE_OUTBOUND_PROXY_HOST:}
    proxy-port: ${LOWCODE_OUTBOUND_PROXY_PORT:0}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LOWCODE_DB_URL:jdbc:mysql://localhost:3306/ry-lowcode?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=GMT%2B8}
    username: ${LOWCODE_DB_USERNAME:lowcode_runtime}
    password: ${LOWCODE_DB_PASSWORD:}
    hikari:
      minimum-idle: ${LOWCODE_DB_MIN_IDLE:1}
      maximum-pool-size: ${LOWCODE_DB_MAX_ACTIVE:10}
      connection-timeout: ${LOWCODE_DB_CONNECTION_TIMEOUT_MS:30000}

security:
  session:
    cookie-name: RUOYI_SESSION
    secure-cookie: ${SESSION_COOKIE_SECURE:true}

# 认证令牌配置。SameUrlDataInterceptor 依赖此请求头名称；默认兼容 RuoYi 前端。
token:
  header: ${TOKEN_HEADER:Authorization}

sensor:
  attachment:
    root: ${SENSOR_ATTACHMENT_ROOT:./.local-data/attachments}
    scan-required: ${SENSOR_ATTACHMENT_SCAN_REQUIRED:false}
    virus-scan-command: ${SENSOR_ATTACHMENT_SCAN_COMMAND:}
    virus-scan-arguments: ${SENSOR_ATTACHMENT_SCAN_ARGUMENTS:}
    virus-scan-timeout-seconds: ${SENSOR_ATTACHMENT_SCAN_TIMEOUT_SECONDS:120}
  stream:
    # 约覆盖 500 条/秒下的 24 小时原始特征消息，需按现场容量校准。
    max-length: ${SENSOR_STREAM_MAX_LENGTH:45000000}
    poll-delay-ms: ${SENSOR_STREAM_POLL_DELAY_MS:500}
  diagnosis:
    # 默认开启，但仍受 ACTIVE 模型、置信度和连续命中门槛约束。
    auto-alarm-enabled: ${SENSOR_DIAGNOSIS_AUTO_ALARM_ENABLED:true}
    multi-point-enabled: ${SENSOR_DIAGNOSIS_MULTI_POINT_ENABLED:false}
    read-mode: ${SENSOR_DIAGNOSIS_READ_MODE:iotdb-primary}
    iotdb-sync:
      poll-delay-ms: ${SENSOR_DIAGNOSIS_IOTDB_SYNC_POLL_DELAY_MS:5000}
      batch-size: ${SENSOR_DIAGNOSIS_IOTDB_SYNC_BATCH_SIZE:100}
      lease-seconds: ${SENSOR_DIAGNOSIS_IOTDB_SYNC_LEASE_SECONDS:60}
      degraded-after-seconds: ${SENSOR_DIAGNOSIS_IOTDB_SYNC_DEGRADED_AFTER_SECONDS:60}
    batch:
      max-points: ${SENSOR_DIAGNOSIS_BATCH_MAX_POINTS:8}
    executor:
      core-pool-size: ${SENSOR_DIAGNOSIS_EXECUTOR_CORE_POOL_SIZE:4}
      max-pool-size: ${SENSOR_DIAGNOSIS_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${SENSOR_DIAGNOSIS_EXECUTOR_QUEUE_CAPACITY:100}
  default-device-code: ${SENSOR_DEFAULT_DEVICE_CODE:}
  websocket:
    allowed-origins: ${SENSOR_WS_ALLOWED_ORIGINS:http://localhost}
  inference:
    gear-url: ${SENSOR_GEAR_INFER_URL:}
    bearing-url: ${SENSOR_BEARING_INFER_URL:}
    gear-model-version: ${GEAR_MODEL_VERSION:gear-unregistered}
    bearing-model-version: ${BEARING_MODEL_VERSION:bearing-unregistered}
    default-device-code: ${SENSOR_DEFAULT_DEVICE_CODE:}
    default-model-type: ${SENSOR_DEFAULT_MODEL_TYPE:gear}
    connect-timeout-ms: ${SENSOR_INFER_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${SENSOR_INFER_READ_TIMEOUT_MS:120000}
  mat-receiver:
    enabled: ${SENSOR_MAT_RECEIVER_ENABLED:true}
    bind-address: ${SENSOR_MAT_RECEIVER_BIND_ADDRESS:0.0.0.0}
    port: ${SENSOR_MAT_RECEIVER_PORT:8888}
    max-file-size: ${SENSOR_MAT_RECEIVER_MAX_FILE_SIZE:134217728}
    socket-timeout-ms: ${SENSOR_MAT_RECEIVER_SOCKET_TIMEOUT_MS:120000}
    root: ${SENSOR_MAT_RECEIVER_ROOT:./.local-data/mat-receiver}
    worker-count: ${SENSOR_MAT_RECEIVER_WORKER_COUNT:4}
    max-connections: ${SENSOR_MAT_RECEIVER_MAX_CONNECTIONS:8}
  startup:
    inference:
      enabled: ${SENSOR_INFERENCE_SIDECAR_ENABLED:false}
      dir: ruoyi-sensor/inference
      script: inference_service.py
      python-command: python
  store-type: iotdb
  iotdb:
    enabled: true
    database: monitoring
    telemetry-ttl-days: ${IOTDB_TELEMETRY_TTL_DAYS:1095}
    frame-ttl-days: ${IOTDB_FRAME_TTL_DAYS:90}
    diagnosis-ttl-days: ${IOTDB_DIAGNOSIS_TTL_DAYS:3650}
    node-urls: iotdb-dn-1:6667,iotdb-dn-2:6667,iotdb-dn-3:6667
    username: root
    password: ${IOTDB_PASSWORD:}
    connection-timeout-ms: 3000
    wait-session-timeout-ms: 3000
    query-timeout-ms: 15000
    max-retry-count: 1
    retry-interval-ms: 500
    reconnect-interval-seconds: 30
    rpc-compression: true
    redirection: true
    auto-fetch-nodes: true
    use-ssl: false
    trust-store: ${IOTDB_TRUST_STORE:}
    trust-store-password: ${IOTDB_TRUST_STORE_PASSWORD:}
    fetch-size: 512
    session-pool-size: 8
    ttl-days: 3650
    timestamp-precision: us

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ry-yue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:5}
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:20}
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${MYSQL_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${MYSQL_POOL_IDLE_TIMEOUT_MS:600000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}
    timeout: 10s

# XSS/Referer 过滤器默认配置，避免启动时占位符缺失
filters:
  enabled: false

xss:
  enabled: ${XSS_ENABLED:false}
  excludes: /monitor/operlog/*
  urlPatterns: /*

referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

repeatable:
  enabled: false

# 跨域配置（多个来源用逗号分隔，生产环境务必限制）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:80,http://localhost:9528}

user:
  password:
    maxRetryCount: 5
    lockTime: 10

# 明确开启验证码，避免后端配置缺失时被关闭
sys:
  account:
    captchaEnabled: true

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
