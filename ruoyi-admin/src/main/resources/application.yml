# 项目相关配置
ruoyi:
  # 名称
  name: 振动温度监测平台
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

sensor:
  default-device-code: ${SENSOR_DEFAULT_DEVICE_CODE:}
  collector:
    token: ${SENSOR_COLLECTOR_TOKEN:}
  websocket:
    allowed-origins: ${SENSOR_WS_ALLOWED_ORIGINS:http://localhost}
  inference:
    gear-url: ${SENSOR_GEAR_INFER_URL:}
    bearing-url: ${SENSOR_BEARING_INFER_URL:}
    default-device-code: ${SENSOR_DEFAULT_DEVICE_CODE:}
    default-model-type: ${SENSOR_DEFAULT_MODEL_TYPE:gear}
    connect-timeout-ms: ${SENSOR_INFER_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${SENSOR_INFER_READ_TIMEOUT_MS:120000}
  startup:
    inference:
      enabled: true
      dir: ruoyi-sensor/inference
      script: inference_service.py
      python-command: python
    receiver:
      enabled: true
      dir: ruoyi-sensor/inference/get
      source: CwruMatReceiver.java
      port: 8888
      save-dir: got
      javac-command: javac
      java-command: java
  netty:
    port: 9000
  tcp:
    enabled: true
    port: 8890
  channel-tcp:
    enabled: true
    port: 8891
  store-type: iotdb
  iotdb:
    enabled: true
    database: monitoring
    node-urls: iotdb-dn-1:6667,iotdb-dn-2:6667,iotdb-dn-3:6667
    username: root
    password: ${IOTDB_PASSWORD:}
    connection-timeout-ms: 3000
    wait-session-timeout-ms: 3000
    query-timeout-ms: 15000
    max-retry-count: 1
    retry-interval-ms: 500
    reconnect-interval-seconds: 30
    rpc-compression: true
    redirection: true
    auto-fetch-nodes: true
    use-ssl: false
    trust-store: ${IOTDB_TRUST_STORE:}
    trust-store-password: ${IOTDB_TRUST_STORE_PASSWORD:}
    fetch-size: 512
    session-pool-size: 8
    ttl-days: 3650
    timestamp-precision: us

spring:
  profiles:
    active: dev
  config:
    import: optional:classpath:application-druid.yml
  datasource:
    druid:
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10s

# XSS/Referer 过滤器默认配置，避免启动时占位符缺失
filters:
  enabled: false

xss:
  enabled: ${XSS_ENABLED:false}
  excludes: /system/notice/*,/monitor/operlog/*
  urlPatterns: /*

referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

repeatable:
  enabled: false

# 跨域配置（多个来源用逗号分隔，生产环境务必限制）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:80,http://localhost:9528}

user:
  password:
    maxRetryCount: 5
    lockTime: 10

# 明确开启验证码，避免后端配置缺失时被关闭
sys:
  account:
    captchaEnabled: true

token:
  header: Authorization
  secret: ${JWT_SECRET:}
  expireTime: 30

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
