# 开发环境配置
# 数据源和 Redis 使用 application.yml 中的标准配置。

mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml

lowcode:
  runtime:
    write-enabled: ${LOWCODE_RUNTIME_WRITE_ENABLED:true}

security:
  session:
    secure-cookie: false

sensor:
  diagnosis:
    multi-point-enabled: true
    realtime:
      enabled: ${SENSOR_DIAGNOSIS_REALTIME_ENABLED:false}
  default-device-code: ${SENSOR_DEFAULT_DEVICE_CODE:DEV-001}
  collector:
    token: ${SENSOR_COLLECTOR_TOKEN:}
    master-key: ${SENSOR_COLLECTOR_MASTER_KEY:dev-collector-master-key-not-for-production}
  websocket:
    allowed-origins: ${SENSOR_WS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:9528,http://127.0.0.1:9528}
  inference:
    gear-url: ${SENSOR_GEAR_INFER_URL:http://127.0.0.1:5000/internal/infer}
    bearing-url: ${SENSOR_BEARING_INFER_URL:http://127.0.0.1:5000/internal/infer}
    default-device-code: ${SENSOR_DEFAULT_DEVICE_CODE:BEARING-001}
    default-model-type: ${SENSOR_DEFAULT_MODEL_TYPE:gear}
    connect-timeout-ms: ${SENSOR_INFER_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${SENSOR_INFER_READ_TIMEOUT_MS:120000}
    internal-token: ${SENSOR_INFERENCE_INTERNAL_TOKEN:dev-inference-token-not-for-production}
  startup:
    inference:
      enabled: false
      dir: ruoyi-sensor/inference
      script: inference_service.py
      python-command: python
    receiver:
      enabled: true
      dir: ruoyi-sensor/inference/get
      source: CwruMatReceiver.java
      port: 8888
      save-dir: got
      javac-command: javac
      java-command: java
  netty:
    port: 9000
    boss-threads: 1
    worker-threads: 0
  tcp:
    enabled: true
    port: 8890
  channel-tcp:
    enabled: true
    port: 8891
  store-type: iotdb
  iotdb:
    enabled: true
    database: monitoring
    node-urls: localhost:6667
    username: root
    password: ${IOTDB_PASSWORD:}
    connection-timeout-ms: 3000
    wait-session-timeout-ms: 3000
    query-timeout-ms: 15000
    max-retry-count: 1
    retry-interval-ms: 500
    reconnect-interval-seconds: 30
    rpc-compression: true
    redirection: true
    auto-fetch-nodes: true
    use-ssl: false
    trust-store: ${IOTDB_TRUST_STORE:}
    trust-store-password: ${IOTDB_TRUST_STORE_PASSWORD:}
    fetch-size: 512
    session-pool-size: 4
    ttl-days: 3650
    timestamp-precision: us
