# 开发环境配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: jdbc:mysql://localhost:3306/ry-yue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
        username: root
        password: admin123
      slave:
        enabled: false
        url: 
        username: 
        password: 
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        allow: 
        url-pattern: /druid/*
        login-username: ruoyi
        login-password: 123456
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10s

mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml

sensor:
  startup:
    inference:
      enabled: true
      dir: ruoyi-sensor/inference
      script: inference_service.py
      python-command: python
    receiver:
      enabled: true
      dir: ruoyi-sensor/inference/get
      source: CwruMatReceiver.java
      port: 8888
      save-dir: got
      javac-command: javac
      java-command: java
  netty:
    port: 9000
    boss-threads: 1
    worker-threads: 0
  tcp:
    enabled: true
    port: 8890
  channel-tcp:
    enabled: true
    port: 8891
  tdengine:
    enabled: true
    url: jdbc:TAOS-RS://localhost:6041/sensor_db
    username: root
    password: taosdata
    database: sensor_db
    raw-super-table: sensor_raw_wave_st
    fft-super-table: sensor_fft_point_st
