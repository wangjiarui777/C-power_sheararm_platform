name: production-ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ruoyi-ui/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Java tests and package
        run: mvn --batch-mode clean test package
      - name: Frontend audit and build
        working-directory: ruoyi-ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          npm run build:prod
          npm run check:bundle
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
      - name: Python inference tests
        working-directory: ruoyi-sensor/inference
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit
          python -m pip_audit -r requirements.txt
          python -m compileall -q .
          python -m pytest
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: phm-build
          path: |
            ruoyi-admin/target/ruoyi-admin.jar
            ruoyi-ui/dist

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"

  java-security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: JaCoCo and SpotBugs
        run: mvn --batch-mode -DskipTests verify -Psecurity-gates
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: java-security-reports
          path: |
            **/target/site/jacoco
            **/target/spotbugs*.xml

  testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Require Docker
        run: docker info
      - name: MySQL migration Testcontainers
        run: mvn --batch-mode -pl ruoyi-admin -am -Dtest=LowCodeV2MigrationTest,ProductionHardeningMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Redis Testcontainers
        run: mvn --batch-mode -pl ruoyi-sensor -am -Dtest=RedisFrameStreamIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Reject skipped container tests
        shell: bash
        run: |
          if grep -R "<skipped" ruoyi-admin/target/surefire-reports ruoyi-sensor/target/surefire-reports; then
            echo "Required Testcontainers tests were skipped"
            exit 1
          fi
