name: production-ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ruoyi-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Java tests and package
        run: mvn --batch-mode clean test package
      - name: Reliable edge gateway tests and package
        working-directory: ruoyi-sensor/mock
        run: mvn --batch-mode clean test package
      - name: Frontend audit and build
        working-directory: ruoyi-ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          npm run build:prod
          npm run check:bundle
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
      - name: Python inference tests
        working-directory: ruoyi-sensor/inference
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit
          python -m pip_audit -r requirements.txt
          python -m compileall -q .
          python -m pytest
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phm-build
          path: |
            ruoyi-admin/target/ruoyi-admin.jar
            ruoyi-ui/dist
            ruoyi-sensor/mock/target/vibration-simulator-1.0.0.jar

  java-security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-${{ runner.os }}-
      - name: JaCoCo, SpotBugs and OWASP Dependency-Check
        run: mvn --batch-mode -DskipTests verify -Psecurity-gates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-security-reports
          path: |
            **/target/site/jacoco
            **/target/spotbugs*.xml
            target/dependency-check-report.*

  testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Require Docker
        run: docker info
      - name: MySQL migration Testcontainers
        run: mvn --batch-mode -pl ruoyi-admin -am -Dtest=LowCodeV2MigrationTest,ProductionHardeningMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Redis Testcontainers
        run: mvn --batch-mode -pl ruoyi-sensor -am -Dtest=RedisFrameStreamIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Reject skipped container tests
        shell: bash
        run: |
          if grep -R "<skipped" ruoyi-admin/target/surefire-reports ruoyi-sensor/target/surefire-reports; then
            echo "Required Testcontainers tests were skipped"
            exit 1
          fi
